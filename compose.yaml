services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kshorts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kshorts-local}
      POSTGRES_DB: kshorts
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kshorts"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
